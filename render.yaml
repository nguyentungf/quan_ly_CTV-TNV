services:
  - type: web
    name: quan-ly-ctv-tnv
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quan-ly-ctv-tnv-db
          property: connectionString

databases:
  - name: quan-ly-ctv-tnv-db
    plan: free
    region: singapore
    databaseName: quan_ly_ctv_tnv
    user: admin_ctv_tnv

